<!--
  Supabase → Authentication → Email Templates → "Magic Link"
  Subject: Your Bring Me! code: {{ .Token }}
  Supabase sends this template to an email that already has an account. It shows ONLY the sign-in code
  (no link): typing it on the sign-in screen signs the host in.
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1f1147;">
  <h1 style="font-size: 22px; margin: 0 0 12px;">Your Bring Me! code</h1>
  <p style="margin: 0 0 16px;">Enter this code on the sign-in screen:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; margin: 0 0 16px; color: #4c1d95;">{{ .Token }}</p>
  <p style="font-size: 13px; color: #6b6489; margin: 0;">It works once and expires in an hour. If you didn't ask for it, you can ignore this email.</p>
</div>
